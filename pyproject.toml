[project]
name = "yaft"
version = "0.2.0"
description = "Yet another Feature Toggle: decorators for functions, methods and classes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tehw0lf", email = "tehwolf@protonmail.com" }]
requires-python = ">=3.11"
# No runtime dependencies, on purpose: a feature toggle library should not pull
# a dependency tree into every application that uses it.
dependencies = []
keywords = ["feature", "toggle", "feature-toggle", "feature-flag", "yaft"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tehw0lf/yaft-python"
Repository = "https://github.com/tehw0lf/yaft-python"
Issues = "https://github.com/tehw0lf/yaft-python/issues"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
